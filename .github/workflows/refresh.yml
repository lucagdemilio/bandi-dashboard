name: Aggiornamento bandi

# Esegue lo scraping ogni giorno e committa il database aggiornato.
# Streamlit Community Cloud rileva il nuovo commit e ricarica l'app con i dati freschi.
on:
  schedule:
    # 05:00 UTC ≈ 07:00 in Italia (ora legale) / 06:00 (ora solare).
    - cron: "0 5 * * *"
  workflow_dispatch: {}      # permette anche l'avvio manuale dalla tab "Actions"

permissions:
  contents: write            # necessario per committare il DB aggiornato

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui gli scraper
        # "|| true": un errore su una singola fonte (es. HTML cambiato) non deve
        # bloccare il commit delle fonti andate a buon fine.
        run: python aggiorna_bandi.py || true

      - name: Committa il database aggiornato
        run: |
          git config user.name "bandi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bandi.db
          if git diff --staged --quiet; then
            echo "Nessuna modifica al database, niente da committare."
          else
            git commit -m "Aggiornamento automatico bandi ($(date -u +%Y-%m-%d))"
            git push
          fi
